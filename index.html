<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Fire Tournament Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --neon-orange: #ff6b00;
  --neon-yellow: #ffd700;
  --neon-red: #ff2d55;
  --neon-cyan: #00d4ff;
  --neon-green: #00ff88;
  --neon-blue: #4169ff;
  --bg-dark: #050508;
  --bg-card: #0d0d18;
  --bg-surface: #13131f;
  --bg-elevated: #1a1a2e;
  --text-primary: #f0f0ff;
  --text-secondary: #8888aa;
  --text-muted: #444466;
  --border-color: #2a2a44;
  --gradient-fire: linear-gradient(135deg, #ff6b00, #ff2d55, #ffd700);
  --gradient-card: linear-gradient(135deg, #13131f 0%, #1a1a2e 100%);
  --shadow-neon: 0 0 20px rgba(255,107,0,0.3);
  --shadow-glow: 0 0 40px rgba(255,107,0,0.15);
  --font-display: 'Orbitron', monospace;
  --font-ui: 'Rajdhani', sans-serif;
  --font-body: 'Exo 2', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-body);
  background: var(--bg-dark);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
}
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-dark); }
::-webkit-scrollbar-thumb { background: var(--neon-orange); border-radius: 3px; }

/* ── SPLASH ── */
#splash {
  position: fixed; inset: 0; z-index: 9999;
  background: var(--bg-dark);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 24px;
  transition: opacity 0.6s, transform 0.6s;
}
#splash.hidden { opacity: 0; transform: scale(1.05); pointer-events: none; }
.splash-logo {
  font-family: var(--font-display); font-size: clamp(2rem,6vw,4rem);
  font-weight: 900; background: var(--gradient-fire);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  text-align: center; animation: pulse-glow 1.5s ease-in-out infinite;
}
.splash-sub { font-family: var(--font-ui); font-size: 1.1rem; color: var(--text-secondary); letter-spacing: 4px; text-transform: uppercase; }
.splash-bar-wrap { width: 280px; height: 4px; background: var(--bg-elevated); border-radius: 2px; overflow: hidden; }
.splash-bar { height: 100%; background: var(--gradient-fire); border-radius: 2px; animation: load-bar 2.2s ease-in-out forwards; }
.splash-fire { font-size: 3rem; animation: bounce 0.6s ease-in-out infinite alternate; }
@keyframes load-bar { from{width:0} to{width:100%} }
@keyframes bounce { from{transform:translateY(0)} to{transform:translateY(-10px)} }
@keyframes pulse-glow { 0%,100%{filter:drop-shadow(0 0 8px rgba(255,107,0,0.6))} 50%{filter:drop-shadow(0 0 20px rgba(255,107,0,1))} }

/* ── APP SHELL ── */
#app { display: none; flex-direction: column; min-height: 100vh; }
#app.active { display: flex; }

/* ── NAVBAR ── */
nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(5,5,8,0.97);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border-color);
  padding: 0 20px; height: 60px;
  display: flex; align-items: center; justify-content: space-between;
}
.nav-logo {
  font-family: var(--font-display); font-size: 1.1rem; font-weight: 700;
  background: var(--gradient-fire); -webkit-background-clip: text;
  -webkit-text-fill-color: transparent; cursor: pointer;
}
.nav-right { display: flex; align-items: center; gap: 8px; }
.nav-btn {
  background: none; border: 1px solid var(--border-color);
  color: var(--text-secondary); padding: 6px 14px;
  border-radius: 6px; font-family: var(--font-ui);
  font-size: 0.85rem; cursor: pointer; transition: all 0.2s;
}
.nav-btn:hover { border-color: var(--neon-orange); color: var(--neon-orange); }
.nav-btn.primary { background: var(--gradient-fire); border: none; color: #fff; font-weight: 700; }
.nav-btn.primary:hover { opacity: 0.85; transform: translateY(-1px); }
.wallet-badge {
  background: var(--bg-elevated); border: 1px solid var(--neon-yellow);
  color: var(--neon-yellow); padding: 5px 12px; border-radius: 20px;
  font-family: var(--font-ui); font-size: 0.85rem; font-weight: 700;
  display: flex; align-items: center; gap: 5px;
}

/* ── CROWN ADMIN BUTTON ── */
.crown-admin-btn {
  position: fixed; top: 12px; right: 12px; z-index: 200;
  background: none; border: none; cursor: pointer;
  font-size: 1.5rem; filter: drop-shadow(0 0 6px rgba(255,215,0,0.4));
  transition: all 0.3s; animation: crownFloat 3s ease-in-out infinite;
  line-height: 1;
}
.crown-admin-btn:hover {
  filter: drop-shadow(0 0 16px rgba(255,215,0,0.9));
  transform: scale(1.2) rotate(-8deg);
}
@keyframes crownFloat {
  0%,100%{transform:translateY(0) rotate(0deg)} 
  50%{transform:translateY(-4px) rotate(3deg)}
}

/* ── BOTTOM NAV ── */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  background: rgba(5,5,8,0.97); backdrop-filter: blur(20px);
  border-top: 1px solid var(--border-color);
  display: none; align-items: center; justify-content: space-around;
  padding: 8px 0 12px;
}
@media (max-width: 640px) { .bottom-nav { display: flex; } }
.bnav-item {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: none; border: none; color: var(--text-muted);
  font-size: 0.65rem; font-family: var(--font-ui); cursor: pointer;
  transition: color 0.2s; padding: 4px 12px;
}
.bnav-item span:first-child { font-size: 1.3rem; }
.bnav-item.active { color: var(--neon-orange); }

/* ── PAGES ── */
.page { display: none; flex: 1; padding: 20px; max-width: 1200px; margin: 0 auto; width: 100%; }
.page.active { display: block; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
@media (max-width: 640px) { .page { padding-bottom: 80px; } }

/* ── AUTH PAGE ── */
.auth-container {
  max-width: 440px; margin: 40px auto;
  background: var(--gradient-card);
  border: 1px solid var(--border-color);
  border-radius: 16px; padding: 40px 32px;
  box-shadow: var(--shadow-glow);
}
.auth-title {
  font-family: var(--font-display); font-size: 1.5rem; font-weight: 700;
  text-align: center; margin-bottom: 8px;
  background: var(--gradient-fire); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.auth-sub { text-align: center; color: var(--text-secondary); margin-bottom: 28px; font-size: 0.9rem; }
.form-group { margin-bottom: 18px; }
.form-group label {
  display: block; margin-bottom: 7px; font-family: var(--font-ui); font-weight: 600;
  font-size: 0.85rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px;
}
.form-control {
  width: 100%; padding: 12px 16px;
  background: var(--bg-dark); border: 1px solid var(--border-color);
  border-radius: 8px; color: var(--text-primary);
  font-family: var(--font-body); font-size: 0.95rem;
  transition: border-color 0.2s, box-shadow 0.2s; outline: none;
}
.form-control:focus { border-color: var(--neon-orange); box-shadow: 0 0 0 3px rgba(255,107,0,0.15); }
.form-control::placeholder { color: var(--text-muted); }
.btn {
  padding: 12px 24px; border-radius: 8px; border: none;
  font-family: var(--font-ui); font-weight: 700;
  font-size: 1rem; cursor: pointer; transition: all 0.2s;
  letter-spacing: 1px; text-transform: uppercase;
}
.btn-primary { background: var(--gradient-fire); color: #fff; width: 100%; box-shadow: var(--shadow-neon); }
.btn-primary:hover { opacity: 0.9; transform: translateY(-2px); box-shadow: 0 6px 30px rgba(255,107,0,0.4); }
.btn-outline { background: none; border: 1px solid var(--border-color); color: var(--text-secondary); }
.btn-outline:hover { border-color: var(--neon-orange); color: var(--neon-orange); }
.btn-danger { background: var(--neon-red); color: #fff; }
.btn-success { background: var(--neon-green); color: #000; font-weight: 700; }
.btn-blue { background: linear-gradient(135deg, #4169ff, #00d4ff); color: #fff; font-weight: 700; }
.btn-sm { padding: 7px 14px; font-size: 0.8rem; width: auto; }
.auth-switch { text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--text-secondary); }
.auth-switch a { color: var(--neon-orange); cursor: pointer; text-decoration: none; font-weight: 600; }

/* ── DASHBOARD ── */
.page-header { margin-bottom: 28px; }
.page-title {
  font-family: var(--font-display); font-size: clamp(1.4rem,4vw,2rem); font-weight: 700;
  background: var(--gradient-fire); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.page-sub { color: var(--text-secondary); margin-top: 4px; font-size: 0.9rem; }
.stats-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 16px; margin-bottom: 28px;
}
.stat-card {
  background: var(--gradient-card); border: 1px solid var(--border-color);
  border-radius: 12px; padding: 20px; position: relative; overflow: hidden;
  transition: transform 0.2s, box-shadow 0.2s;
}
.stat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-neon); }
.stat-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background: var(--gradient-fire); }
.stat-icon { font-size: 1.6rem; margin-bottom: 8px; }
.stat-value { font-family: var(--font-display); font-size: 1.8rem; font-weight: 700; color: var(--neon-yellow); line-height: 1; }
.stat-label { font-family: var(--font-ui); font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }

/* ── CARDS ── */
.card {
  background: var(--gradient-card); border: 1px solid var(--border-color);
  border-radius: 14px; padding: 24px; margin-bottom: 20px;
}
.card-title {
  font-family: var(--font-ui); font-size: 1rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 2px; color: var(--text-secondary);
  margin-bottom: 18px; display: flex; align-items: center; gap: 8px;
}
.card-title::after { content:''; flex:1; height:1px; background: var(--border-color); }

/* ── TOURNAMENT CARDS ── */
.tournament-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
.tournament-card {
  background: var(--gradient-card); border: 1px solid var(--border-color);
  border-radius: 14px; overflow: hidden; transition: transform 0.2s, box-shadow 0.2s; position: relative;
}
.tournament-card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,0.4); }
.tournament-card-header {
  background: linear-gradient(135deg, #1a0a00, #2a0d00);
  padding: 20px; position: relative; overflow: hidden;
}
.tournament-card-header::before {
  content:'🎮'; position:absolute; right:16px; top:50%;
  transform:translateY(-50%); font-size:3rem; opacity:0.15;
}
.t-status {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px; border-radius: 20px;
  font-family: var(--font-ui); font-size: 0.75rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px;
}
.t-status.open { background:rgba(0,255,136,0.15); color:var(--neon-green); border:1px solid rgba(0,255,136,0.3); }
.t-status.upcoming { background:rgba(0,212,255,0.15); color:var(--neon-cyan); border:1px solid rgba(0,212,255,0.3); }
.t-status.live { background:rgba(255,45,85,0.15); color:var(--neon-red); border:1px solid rgba(255,45,85,0.3); animation:blink 1s infinite; }
.t-status.closed { background:rgba(136,136,170,0.15); color:var(--text-secondary); border:1px solid var(--border-color); }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.5} }
.t-status::before { content:'●'; font-size:0.5rem; }
.t-name { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; }
.t-mode { font-size: 0.85rem; color: var(--text-secondary); }
.tournament-card-body { padding: 18px; }
.t-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.t-meta-item { text-align: center; }
.t-meta-value { font-family: var(--font-ui); font-size: 1rem; font-weight: 700; color: var(--neon-yellow); }
.t-meta-label { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
.t-slots-bar { height: 6px; background: var(--bg-dark); border-radius: 3px; margin-bottom: 14px; overflow: hidden; }
.t-slots-fill { height: 100%; background: var(--gradient-fire); border-radius: 3px; transition: width 0.5s; }
.t-slots-text { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 14px; }
.countdown-timer { font-family: var(--font-display); font-size: 0.9rem; color: var(--neon-cyan); margin-bottom: 14px; text-align: center; }

/* ── BADGES ── */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 10px; border-radius: 20px;
  font-family: var(--font-ui); font-size: 0.75rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.5px;
}
.badge-pending { background:rgba(255,215,0,0.15); color:var(--neon-yellow); border:1px solid rgba(255,215,0,0.3); }
.badge-approved { background:rgba(0,255,136,0.15); color:var(--neon-green); border:1px solid rgba(0,255,136,0.3); }
.badge-rejected { background:rgba(255,45,85,0.15); color:var(--neon-red); border:1px solid rgba(255,45,85,0.3); }

/* ── MODAL ── */
.modal-overlay {
  position: fixed; inset: 0; z-index: 500;
  background: rgba(0,0,0,0.85); backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center;
  padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.2s;
}
.modal-overlay.active { opacity: 1; pointer-events: all; }
.modal {
  background: var(--bg-surface); border: 1px solid var(--border-color);
  border-radius: 16px; padding: 28px;
  width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto;
  position: relative; transform: translateY(20px); transition: transform 0.2s;
}
.modal-overlay.active .modal { transform: translateY(0); }
.modal-title {
  font-family: var(--font-display); font-size: 1.2rem; font-weight: 700;
  background: var(--gradient-fire); -webkit-background-clip: text;
  -webkit-text-fill-color: transparent; margin-bottom: 20px;
}
.modal-close {
  position: absolute; top: 16px; right: 16px;
  background: none; border: none; font-size: 1.4rem;
  color: var(--text-secondary); cursor: pointer;
}
.modal-close:hover { color: var(--neon-red); }

/* ── ADMIN LOGIN CROWN MODAL ── */
#adminLoginModal .modal {
  border: 1px solid rgba(255,215,0,0.4);
  box-shadow: 0 0 40px rgba(255,215,0,0.15);
}
.crown-modal-header {
  text-align: center; margin-bottom: 24px;
}
.crown-big { font-size: 3.5rem; display: block; margin-bottom: 8px; filter: drop-shadow(0 0 12px rgba(255,215,0,0.7)); animation: crownSpin 2s ease-in-out; }
@keyframes crownSpin { 0%{transform:rotateY(0deg) scale(0.5)} 60%{transform:rotateY(360deg) scale(1.2)} 100%{transform:rotateY(360deg) scale(1)} }
.crown-modal-title {
  font-family: var(--font-display); font-size: 1.4rem; font-weight: 900;
  color: var(--neon-yellow); text-shadow: 0 0 20px rgba(255,215,0,0.5);
  letter-spacing: 2px;
}
.crown-modal-sub { font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px; }

/* ── TOAST ── */
#toast-container {
  position: fixed; top: 70px; right: 16px; z-index: 9000;
  display: flex; flex-direction: column; gap: 10px; pointer-events: none;
}
.toast {
  background: var(--bg-elevated); border: 1px solid var(--border-color);
  border-radius: 10px; padding: 14px 18px;
  font-family: var(--font-ui); font-size: 0.9rem;
  display: flex; align-items: center; gap: 10px;
  max-width: 320px; pointer-events: all;
  animation: toast-in 0.3s ease;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}
.toast.success { border-left: 4px solid var(--neon-green); }
.toast.error { border-left: 4px solid var(--neon-red); }
.toast.info { border-left: 4px solid var(--neon-cyan); }
.toast.warning { border-left: 4px solid var(--neon-yellow); }
@keyframes toast-in { from{opacity:0;transform:translateX(30px)} to{opacity:1;transform:translateX(0)} }

/* ── TABLES ── */
.table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border-color); }
table { width: 100%; border-collapse: collapse; }
th {
  background: var(--bg-elevated); padding: 12px 16px;
  font-family: var(--font-ui); font-size: 0.75rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-secondary);
  text-align: left; border-bottom: 1px solid var(--border-color); white-space: nowrap;
}
td { padding: 12px 16px; border-bottom: 1px solid rgba(42,42,68,0.5); font-size: 0.9rem; vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(255,107,0,0.04); }

/* ── PROFILE ── */
.profile-header {
  background: linear-gradient(135deg, #1a0a00, #0d0d18);
  border: 1px solid var(--border-color); border-radius: 16px; padding: 32px;
  display: flex; align-items: center; gap: 24px; margin-bottom: 24px; flex-wrap: wrap;
}
.avatar {
  width: 80px; height: 80px; border-radius: 50%;
  background: var(--gradient-fire); display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-size: 2rem; font-weight: 900; color: #fff;
  flex-shrink: 0; box-shadow: 0 0 30px rgba(255,107,0,0.4);
}
.profile-info { flex: 1; min-width: 200px; }
.profile-name { font-family: var(--font-display); font-size: 1.4rem; font-weight: 700; }
.profile-uid { font-size: 0.8rem; color: var(--text-muted); font-family: monospace; margin-top: 4px; }
.profile-meta { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; }
.profile-meta-item { font-family: var(--font-ui); font-size: 0.85rem; color: var(--text-secondary); }
.profile-meta-item span { color: var(--neon-yellow); font-weight: 700; }

/* ── WALLET ── */
.wallet-card {
  background: linear-gradient(135deg, #1a0e00, #0a0a1a);
  border: 1px solid rgba(255,215,0,0.3); border-radius: 16px; padding: 28px;
  margin-bottom: 20px; position: relative; overflow: hidden;
}
.wallet-card::before {
  content:'💰'; position:absolute; right:24px; top:50%;
  transform:translateY(-50%); font-size:5rem; opacity:0.08;
}
.wallet-balance { font-family: var(--font-display); font-size: 3rem; font-weight: 900; color: var(--neon-yellow); line-height: 1; }
.wallet-label { font-family: var(--font-ui); font-size: 0.8rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 2px; margin-top: 6px; }

/* ── ROOM ── */
.room-card {
  background: linear-gradient(135deg, #0d1a0d, #001a0d);
  border: 1px solid rgba(0,255,136,0.3); border-radius: 14px; padding: 24px; margin-bottom: 16px;
}
.room-field { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.room-label { font-family: var(--font-ui); font-size: 0.8rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; }
.room-value { font-family: var(--font-display); font-size: 1.4rem; font-weight: 700; color: var(--neon-green); letter-spacing: 4px; }
.copy-btn {
  background: rgba(0,255,136,0.1); border: 1px solid rgba(0,255,136,0.3);
  color: var(--neon-green); padding: 5px 12px; border-radius: 6px;
  font-size: 0.78rem; cursor: pointer; font-family: var(--font-ui); font-weight: 700;
  transition: all 0.2s;
}
.copy-btn:hover { background: rgba(0,255,136,0.2); }

/* ── PAYMENT ── */
.payment-info {
  background: linear-gradient(135deg, rgba(255,107,0,0.1), rgba(255,45,85,0.05));
  border: 1px solid rgba(255,107,0,0.3); border-radius: 12px; padding: 20px; margin-bottom: 20px;
}
.payment-number { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; color: var(--neon-yellow); letter-spacing: 2px; }
.payment-step { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; font-size: 0.9rem; }
.payment-step-num {
  width: 24px; height: 24px; border-radius: 50%; background: var(--gradient-fire);
  color: #fff; font-weight: 700; font-size: 0.75rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.file-
